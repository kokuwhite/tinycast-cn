name: Probe tests

# Temporary: runs the test harness against a chosen upstream ref, to tell an environment or
# pre-existing failure apart from one this fork introduced. Delete once the question is answered.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to check out"
        type: string
        default: "abue-ammar/tinycast"
      ref:
        description: "Ref to check out"
        type: string
        default: "v0.11.12"
      script:
        description: "Script to run in the checked-out tree"
        type: string
        default: "./Scripts/run-tests.sh"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26
        run: |
          XCODE_CANDIDATES=(/Applications/Xcode_26*.app)
          XCODE_PATH="$(printf '%s\n' "${XCODE_CANDIDATES[@]}" | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Which tree
        run: git log --oneline -1 && git describe --tags --always

      # The project signs with the stable self-signed identity, so any build — including the
      # localization extraction — needs it in a keychain first.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      # The script goes through an env var, never through the run: line: GitHub substitutes an
      # expression there before the shell parses it, so any quote or pipe in the script would be
      # re-interpreted (or silently stripped) on the way in.
      - name: Run the script
        env:
          PROBE_SCRIPT: ${{ inputs.script }}
        run: |
          set +e
          bash -c "$PROBE_SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
          STATUS=$?
          echo "$PROBE_SCRIPT exit: $STATUS"
          tail -n 200 "$RUNNER_TEMP/out.log"
          echo "::notice::$PROBE_SCRIPT exited $STATUS"
          exit 0
