name: Probe tests

# Temporary: runs the test harness against a chosen upstream ref, to tell an environment or
# pre-existing failure apart from one this fork introduced. Delete once the question is answered.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to check out"
        type: string
        default: "abue-ammar/tinycast"
      ref:
        description: "Ref to check out"
        type: string
        default: "v0.11.12"
      script:
        description: "Script to run in the checked-out tree"
        type: string
        default: "./Scripts/run-tests.sh"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26
        run: |
          XCODE_CANDIDATES=(/Applications/Xcode_26*.app)
          XCODE_PATH="$(printf '%s\n' "${XCODE_CANDIDATES[@]}" | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Which tree
        run: git log --oneline -1 && git describe --tags --always

      - name: Run the script
        run: |
          set +e
          bash -c "${{ inputs.script }}" > "$RUNNER_TEMP/out.log" 2>&1
          STATUS=$?
          echo "${{ inputs.script }} exit: $STATUS"
          tail -n 90 "$RUNNER_TEMP/out.log"
          echo "::notice::${{ inputs.script }} exited $STATUS"
          exit 0
